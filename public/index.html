<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fisterra — Carga de Puntos de Venta a Finnegans</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="fisterra-logo.png" alt="Logo Fisterra" />
        <div>
          <h1>FISTERRA <span class="brand-thin">FileSender</span></h1>
          <p>Carga de Puntos de Venta a Finnegans GO</p>
        </div>
      </div>
      <span class="version-badge" aria-label="Versión de la aplicación">Versión 1.1.1</span>
    </div>
  </header>

  <main>
    <!-- Paso 1: elegir archivo -->
    <section class="card" id="card-upload">
      <h2><span class="step">1</span> Seleccionar archivo</h2>
      <div class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".xlsx,.xls" hidden />
        <p class="dz-main">Arrastrá el archivo Excel acá</p>
        <p class="dz-sub">o hacé clic para buscarlo (.xlsx)</p>
        <p class="dz-file" id="dzFile"></p>
      </div>
      <div class="options-grid">
        <div class="options-row">
          <label for="empresaId">Empresa <span class="hint">(la selección tiene prioridad sobre la columna SUCURSAL)</span></label>
          <select id="empresaId">
            <option value="">Cargando empresas…</option>
          </select>
        </div>
        <div class="options-row">
          <label for="subtipoId">TransaccionSubtipoCodigo por defecto <span class="hint">(si el Excel no trae la columna TRANSACCIONSUBTIPO)</span></label>
          <input type="text" id="subtipoId" value="PTOVTA-FV" readonly />
        </div>
        <div class="options-row">
          <label for="subtipoNotaCreditoId">TransaccionSubtipoCodigo nota de crédito <span class="hint">(si TIPO COMPROBANTE es NC)</span></label>
          <input type="text" id="subtipoNotaCreditoId" value="PTOVTA-NC" readonly />
        </div>
      </div>
      <button class="btn btn-primary" id="btnParse" disabled>Analizar archivo</button>
      <p class="error" id="parseError"></p>
    </section>

    <!-- Paso 2: vista previa -->
    <section class="card hidden" id="card-preview">
      <h2><span class="step">2</span> Vista previa de puntos de venta</h2>
      <p class="summary" id="previewSummary"></p>
      <div class="table-wrap">
        <table id="previewTable">
          <thead>
            <tr>
              <th><input type="checkbox" id="checkAll" checked /></th>
              <th>Nº</th>
              <th>Comprobante</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Ítems</th>
              <th>Total</th>
              <th>Payload</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="btnSend">Enviar seleccionados a Finnegans</button>
        <span class="spinner hidden" id="spinner"></span>
      </div>
      <p class="error" id="sendError"></p>
    </section>

    <!-- Paso 3: resultado -->
    <section class="card hidden" id="card-result">
      <h2><span class="step">3</span> Resultado del envío</h2>
      <p class="summary" id="resultSummary"></p>
    </section>
  </main>

  <!-- Modal para ver el JSON del payload -->
  <div class="modal hidden" id="jsonModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="jsonTitle">Payload</h3>
        <button class="btn-close" id="jsonClose">×</button>
      </div>
      <pre id="jsonBody"></pre>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
